<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root {
      --ink: #1a1d23; --muted: #6b7280; --border: #e5e7eb; --bg: #f6f7f9;
      --card: #ffffff; --accent: #2f6f4e; --accent-dark: #245a3f; --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: var(--bg); color: var(--ink); margin: 0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; width: 100%; max-width: 360px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04), 0 1px 2px rgba(16, 24, 40, 0.03);
    }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 22px; letter-spacing: -0.01em; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; margin-bottom: 16px;
    }
    button {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 12px 20px; border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
    .flash.error { background: #fde8e8; color: #9b1c1c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Astra Chemtech</div>
    <h1>Sign in</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
